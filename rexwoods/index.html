<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rex Woods · Andrea Faveri</title>
<meta name="description" content="Rex Woods: wooden things made by hand by Andrea Faveri.">
<meta name="robots" content="noindex">
<link rel="icon" href="images/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<!-- ?v= makes Cloudflare (4 h cache) fetch the new file: bump it when style.css or the scripts change -->
<link rel="stylesheet" href="style.css?v=2026-10-28-4">
</head>
<body>

<header class="bar">
  <a class="bar-mark" href="#top" aria-label="Rex Woods"><img src="images/rw-mark-dark.png" alt=""></a>
  <div class="bar-right">
    <a class="bar-back" href="../index.html">← rxsas.it</a>
    <button class="bar-lang" type="button" aria-label="Passa all’italiano">IT</button>
  </div>
</header>

<main id="top">
  <section class="hero">
    <img class="hero-logo" src="images/rexwoods-logo-dark.png" alt="Rex Woods" width="416" height="591">
    <p class="hero-line" data-it="Oggetti in legno, fatti a mano, uno alla volta.">Wooden things, made by hand, one at a time.</p>
    <p class="hero-note" data-it="Il laboratorio di Andrea: legno, scalpelli e pazienza.">Andrea’s workshop: wood, chisels and patience.</p>
  </section>

  <hr class="rule">

  <section class="section" id="journal-section">
    <p class="section-label" data-it="Il diario">The journal</p>
    <h2 class="section-title" data-it="Dal banco da lavoro">From the bench</h2>
    <div id="journal" class="journal"></div>
  </section>
</main>

<footer class="foot">
  <img src="images/rw-mark-dark.png" alt="">
  <span>© 2026 Rex Woods · <button type="button" id="admin-open" class="foot-name">Andrea Faveri</button></span>
</footer>

<script>
  /* EN/IT like the main site: the button shows the other language, and the choice is shared with
     rxsas.it through localStorage 'lang'. posts.js re-renders on 'langchange'. */
  (function () {
    var btn = document.querySelector('.bar-lang');
    var nodes = document.querySelectorAll('[data-it]');
    function setLang(l, save) {
      document.documentElement.lang = l;
      nodes.forEach(function (n) {
        if (n._en == null) n._en = n.textContent;
        n.textContent = l === 'it' ? n.dataset.it : n._en;
      });
      btn.textContent = l === 'it' ? 'EN' : 'IT';
      btn.setAttribute('aria-label', l === 'it' ? 'Switch to English' : 'Passa all’italiano');
      if (save) {
        try { localStorage.setItem('lang', l); } catch (e) {}
        document.dispatchEvent(new Event('langchange'));
      }
    }
    var saved = 'en';
    try { saved = localStorage.getItem('lang') === 'it' ? 'it' : 'en'; } catch (e) {}
    setLang(saved, false);
    btn.addEventListener('click', function () { setLang(document.documentElement.lang === 'it' ? 'en' : 'it', true); });
  })();
</script>
<script src="posts.js?v=2026-10-28-2"></script>
<script src="admin.js?v=2026-10-28"></script>
</body>
</html>
